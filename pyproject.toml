[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gloformulas-reference"
version = "0.3.3"
requires-python = ">=3.11"
description = "Provenance-first living peptide reference database"
dependencies = []
[project.optional-dependencies]
monitor = ["cryptography>=44,<47"]
test = ["PyYAML>=6,<7"]
lab = ["pypdf>=5,<7"]
browser = ["playwright>=1.48,<2"]
google = ["google-api-python-client>=2.150,<3", "google-auth>=2.35,<3", "google-auth-oauthlib>=1.2,<2"]
[project.scripts]
glo = "gloformulas.cli:main"
[tool.setuptools.package-data]
gloformulas = ["schema.sql"]
[tool.setuptools]
packages = ["gloformulas"]
